<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictée avec ElevenLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde3dc;--bg2:#fbd3cf;--card:#fff7f4;--ink:#4a2c3a;--mute:#8a6272;--line:#f2c3c3;--rose:#c8507a;--rose-d:#a73d63;--peach:#f9b9a8;color-scheme:light;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-size:16px;line-height:1.6;background:radial-gradient(circle at 12% 0%,#fff1ec 0,transparent 45%),radial-gradient(circle at 100% 100%,var(--bg2) 0,transparent 50%),var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:760px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;margin-bottom:22px}
h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-.5px;color:var(--rose-d)}
.sub{margin:6px 0 0;color:var(--mute);font-weight:500}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(200,80,122,.08)}
h2{font-size:16px;font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--rose-d)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.full{grid-column:1/-1}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.chk input{margin-top:5px;accent-color:var(--rose)}
.chk label{margin:0;font-size:14px;font-weight:500;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--rose)}
.val{color:var(--rose-d);font-weight:700}
button{font:inherit;font-weight:600;font-size:15px;border-radius:999px;border:1.5px solid var(--rose);padding:10px 20px;cursor:pointer;background:transparent;color:var(--rose-d);transition:background .15s}
button:hover:not(:disabled){background:#fde3ea}
button.main{background:var(--rose);color:#fff}
button.main:hover:not(:disabled){background:var(--rose-d)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.phase{font-size:21px;font-weight:700;color:var(--ink)}
.status{color:var(--mute);min-height:1.6em;font-weight:500}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--rose));border-radius:4px;transition:width .3s}
.board{margin-top:14px;padding:12px 16px;background:#fff;border:2px dashed var(--rose);border-radius:14px;font-size:22px;font-weight:700;letter-spacing:.5px}
.board small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:2px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
ol.segs{margin:14px 0 0;padding-left:24px;font-size:15px}
ol.segs li{margin:3px 0}
ol.segs li.cur{color:var(--rose-d);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<h1>Dictée</h1>
<p class="sub">Collez votre texte, la voix lit la dictée en trois temps comme à l’examen.</p>
</header>

<section>
<h2>Texte</h2>
<label for="text">Texte de la dictée</label>
<textarea id="text" placeholder="Collez ici le texte de la dictée. Une ligne vide entre deux paragraphes sera lue « à la ligne »."></textarea>
<label for="names">Noms propres et mots étrangers (affichés au « tableau » au début)</label>
<input type="text" id="names" placeholder="Par exemple  Mathilde, Étienne">
</section>

<section>
<h2>Réglages</h2>
<div class="grid">
<div><label for="voice">Voix ElevenLabs</label>
<select id="voice">
<option value="DGTOOUoGpoP6UZ9uSWfA">Célian, voix d’homme, ton documentaire</option>
<option value="5l4ttmr4SKNgi0HnOelT">Paul K, voix d’homme, grave</option>
<option value="FvmvwvObRqIHojkEGh5N">Adina, voix de femme, jeune</option>
</select></div>
<div><label for="model">Modèle</label>
<select id="model">
<option value="eleven_multilingual_v2">Multilingual v2 (plus naturel)</option>
<option value="eleven_flash_v2_5">Flash v2.5 (plus rapide, moins cher)</option>
</select></div>
<div class="full"><label for="key">Clé API ElevenLabs (conservée uniquement dans votre navigateur)</label>
<input type="password" id="key" autocomplete="off" placeholder="sk_..."></div>
<div><label for="rate">Vitesse de lecture <span class="val" id="rateV">0,90</span></label>
<input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="0.9"></div>
<div><label for="wpw">Temps d’écriture par mot <span class="val" id="wpwV">0,8 s</span></label>
<input type="range" id="wpw" min="0.3" max="2" step="0.1" value="0.8"></div>
<div class="full"><label for="minw">Longueur minimale d’un groupe <span class="val" id="minwV">5 mots</span></label>
<input type="range" id="minw" min="3" max="12" step="1" value="5"></div>
</div>
<div class="chk"><input type="checkbox" id="punct" checked><label for="punct">Dire la ponctuation à la deuxième lecture (virgule, point, point-virgule…). Décochez si votre texte contient déjà les noms des signes.</label></div>
<div class="chk"><input type="checkbox" id="show"><label for="show">Afficher les groupes de mots pour vérification</label></div>
</section>

<section aria-live="polite">
<div class="phase" id="phase">Prêt</div>
<div class="status" id="status"></div>
<div class="bar"><i id="bar"></i></div>
<div class="board" id="board" hidden></div>
<div class="ctrl">
<button class="main" id="go">Commencer</button>
<button id="pause" disabled>Pause</button>
<button id="stop" disabled>Arrêter</button>
</div>
<div class="ctrl">
<button id="prev" disabled>Groupe précédent</button>
<button id="again" disabled>Répéter ce groupe</button>
<button id="next" disabled>Groupe suivant</button>
</div>
<ol class="segs" id="segs" hidden></ol>
<p class="note">Le déroulement suit l’examen. Première lecture du texte entier, puis chaque groupe de mots lu deux fois, enfin relecture complète.</p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let run=0,paused=false,st={segs:[],i:0,skip:false,phase:0};
const cache=new Map();let curAudio=null;

try{$('key').value=localStorage.getItem('xikey')||''}catch(e){}
$('key').onchange=()=>{try{localStorage.setItem('xikey',$('key').value.trim())}catch(e){}};

function cancelAudio(){if(curAudio){const a=curAudio;curAudio=null;a.pause();a.dispatchEvent(new Event('ended'))}}
function fail(e){run++;paused=false;cancelAudio();buttons(false);setPhase('Erreur ElevenLabs',String(e.message||e))}
function getAudio(t){
  const vid=$('voice').value,k=vid+'|'+$('model').value+'|'+$('rate').value+'|'+t;
  if(cache.has(k))return cache.get(k);
  const p=fetch('https://api.elevenlabs.io/v1/text-to-speech/'+vid+'?output_format=mp3_44100_128',{
    method:'POST',
    headers:{'xi-api-key':$('key').value.trim(),'Content-Type':'application/json'},
    body:JSON.stringify({text:t,model_id:$('model').value,voice_settings:{speed:+$('rate').value}})
  }).then(async r=>{
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));
    return URL.createObjectURL(await r.blob());
  });
  cache.set(k,p);p.catch(()=>cache.delete(k));return p;
}

$('rate').oninput=e=>$('rateV').textContent=(+e.target.value).toFixed(2).replace('.',',');
$('wpw').oninput=e=>$('wpwV').textContent=(+e.target.value).toFixed(1).replace('.',',')+' s';
$('minw').oninput=e=>$('minwV').textContent=e.target.value+' mots';
$('show').onchange=()=>{$('segs').hidden=!$('show').checked||!st.segs.length};

const ok=t=>t===run&&!st.skip;
async function speak(t,token){
  if(!ok(token))return;
  let url;
  try{url=await getAudio(t)}catch(e){fail(e);return}
  if(!ok(token))return;
  await new Promise(res=>{
    const a=new Audio(url);curAudio=a;
    a.onended=a.onerror=()=>res();
    a.play().catch(()=>res());
  });
}
function sleep(ms,token){
  return new Promise(res=>{
    const t0=Date.now();
    const iv=setInterval(()=>{if(!ok(token)||Date.now()-t0>=ms){clearInterval(iv);res()}},100);
  });
}
async function gate(token){while(paused&&token===run)await new Promise(r=>setTimeout(r,150))}

function wc(s){const w=s.replace(/¶/g,' ').trim();return w?w.split(/\s+/).length:0}
function normalize(text){
  return text.trim().replace(/\r/g,'').replace(/\n\s*\n+/g,' ¶ ').replace(/\s*\n\s*/g,' ').replace(/[ \t]+/g,' ');
}
function segment(text){
  const t=normalize(text);
  const parts=t.match(/[^,;:.!?…]+(?:\.\.\.|[,;:.!?…])*[»”)]*\s*/g)||[t];
  const min=+$('minw').value,out=[];let acc='';
  for(const p of parts){
    acc=(acc+' '+p).trim();
    if(wc(acc)>=min){out.push(acc);acc=''}
  }
  if(acc){if(out.length&&wc(acc)<3)out[out.length-1]+=' '+acc;else out.push(acc)}
  return out;
}
function sentences(text){
  const t=normalize(text).replace(/¶/g,' ');
  return t.match(/[^.!?…]+(?:\.\.\.|[.!?…])+[»”)]*|[^.!?…]+$/g)||[t];
}
function spoken(s){
  if(!$('punct').checked)return s.replace(/¶/g,' ');
  return s.replace(/¶/g,' à la ligne ')
    .replace(/\.\.\.|…/g,' points de suspension ')
    .replace(/,/g,' virgule ').replace(/;/g,' point-virgule ').replace(/:/g,' deux-points ')
    .replace(/\?/g,' point d’interrogation ').replace(/!/g,' point d’exclamation ')
    .replace(/\./g,' point ')
    .replace(/[«“]/g,' ouvrez les guillemets ').replace(/[»”]/g,' fermez les guillemets ')
    .replace(/\(/g,' ouvrez la parenthèse ').replace(/\)/g,' fermez la parenthèse ');
}

function setPhase(p,s){$('phase').textContent=p;$('status').textContent=s||''}
function setBar(f){$('bar').style.width=(Math.max(0,Math.min(1,f))*100)+'%'}
function markCur(){
  [...$('segs').children].forEach((li,i)=>li.classList.toggle('cur',i===st.i&&st.phase===2));
}
function buttons(running){
  $('go').disabled=running;$('pause').disabled=!running;$('stop').disabled=!running;
  const p2=running&&st.phase===2;
  $('prev').disabled=$('again').disabled=$('next').disabled=!p2;
}

async function readFull(text,token){
  const ss=sentences(text);
  for(let k=0;k<ss.length;k++){
    await gate(token);if(token!==run)return;
    setBar(k/ss.length);
    if(ss[k+1])getAudio(ss[k+1].trim()).catch(()=>{});
    await speak(ss[k].trim(),token);
    await sleep(450,token);
  }
  setBar(1);
}

async function doSeg(token){
  const s=st.segs[st.i],sp=spoken(s),n=wc(s);
  if(st.segs[st.i+1])getAudio(spoken(st.segs[st.i+1])).catch(()=>{});
  const label='Groupe '+(st.i+1)+' sur '+st.segs.length;
  const title='Lecture 2, par groupes de mots';
  setPhase(title,label+', première lecture');
  await gate(token);await speak(sp,token);if(!ok(token))return;
  await sleep(1800,token);if(!ok(token))return;
  setPhase(title,label+', deuxième lecture');
  await gate(token);await speak(sp,token);if(!ok(token))return;
  setPhase(title,label+', à vous d’écrire');
  await sleep(2000+n*(+$('wpw').value)*1000,token);
}

async function start(){
  const text=$('text').value;
  if(!text.trim()){setPhase('Aucun texte','Collez d’abord le texte de la dictée.');return}
  if(!$('key').value.trim()){setPhase('Clé API manquante','Saisissez votre clé API ElevenLabs dans les réglages.');return}
  cancelAudio();run++;paused=false;$('pause').textContent='Pause';
  const token=run;
  st={segs:segment(text),i:0,skip:false,phase:1};
  const ol=$('segs');ol.innerHTML='';
  st.segs.forEach(s=>{const li=document.createElement('li');li.textContent=s.replace(/¶/g,'');ol.appendChild(li)});
  ol.hidden=!$('show').checked;
  const names=$('names').value.trim();
  $('board').hidden=!names;
  if(names){$('board').innerHTML='<small>Au tableau</small>';$('board').appendChild(document.createTextNode(names))}
  buttons(true);

  setPhase('Lecture 1, texte entier','Écoutez pour comprendre, sans écrire.');
  await readFull(text,token);if(token!==run)return;
  await sleep(2500,token);if(token!==run)return;

  st.phase=2;buttons(true);
  while(st.i<st.segs.length){
    if(token!==run)return;
    markCur();setBar(st.i/st.segs.length);
    await doSeg(token);
    if(token!==run)return;
    if(st.skip){st.skip=false;continue}
    st.i++;
  }
  markCur();setBar(1);
  await sleep(2500,token);if(token!==run)return;

  st.phase=3;buttons(true);
  setPhase('Lecture 3, relecture du texte entier','Relisez votre copie pendant l’écoute.');
  await readFull(text,token);if(token!==run)return;
  setPhase('Terminé','Vérifiez votre copie avant de la rendre.');setBar(1);
  buttons(false);
}

function stop(){
  run++;paused=false;cancelAudio();$('pause').textContent='Pause';
  buttons(false);setPhase('Arrêté','');
}
function jump(i){
  if(st.phase!==2)return;
  st.i=Math.max(0,Math.min(st.segs.length-1,i));st.skip=true;
  paused=false;$('pause').textContent='Pause';cancelAudio();
}
$('go').onclick=start;
$('stop').onclick=stop;
$('pause').onclick=()=>{
  paused=!paused;
  $('pause').textContent=paused?'Reprendre':'Pause';
  if(curAudio){if(paused)curAudio.pause();else curAudio.play()}
};
$('prev').onclick=()=>jump(st.i-1);
$('again').onclick=()=>jump(st.i);
$('next').onclick=()=>jump(st.i+1);
</script>
</body>
</html>
